apiVersion: v1
kind: ServiceAccount
metadata:
  name: volens
  namespace: volcano-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: volens
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "events", "nodes", "persistentvolumeclaims", "persistentvolumes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["scheduling.volcano.sh"]
    resources: ["podgroups", "queues"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: volens
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: volens
subjects:
  - kind: ServiceAccount
    name: volens
    namespace: volcano-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: volens
  namespace: volcano-system
spec:
  replicas: 1
  selector:
    matchLabels: {app: volens}
  template:
    metadata:
      labels: {app: volens}
    spec:
      serviceAccountName: volens
      containers:
        - name: volens
          image: volens:0.1.0-alpha.1
          ports:
            - {name: http, containerPort: 8080}
          env:
            - {name: VOLCANO_REPO_URL, value: "https://github.com/volcano-sh/volcano.git"}
            - {name: VOLCANO_GIT_UPDATE, value: "true"}
            - {name: LLM_BASE_URL, value: "https://api.deepseek.com"}
            - {name: LLM_MODEL, value: "deepseek-v4-pro"}
            - {name: LLM_MAX_TOOL_ROUNDS, value: "4"}
            - {name: LLM_TIMEOUT, value: "10m"}
            - name: LLM_API_KEY
              valueFrom:
                secretKeyRef: {name: volens-llm, key: api-key, optional: true}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: "1", memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: volens
  namespace: volcano-system
spec:
  selector: {app: volens}
  ports:
    - {name: http, port: 8080, targetPort: http}
